<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="annotated-style.css">
    <title>Annotated photo infographic</title>
</head>
<body>
    <div class="annotated-photo">
        <img src="../img/wildfire.webp" alt="Wildfire photo">
        <div class="hotspot" style="top: 28%; left: 35%;">
            <span class="hotspot-dot"></span>
            <div class="hotspot-caption">Espinillo or Ulex europaeus</div>
        </div>
        <div class="hotspot" style="top: 45%; left: 85%;">
            <span class="hotspot-dot"></span>
            <div class="hotspot-caption">Layer of soil mixed with organic elements</div>
        </div>
        <div class="hotspot" style="top: 70%; left: 85%;">
            <span class="hotspot-dot"></span>
            <div class="hotspot-caption">Impermeable layer of gravel and volcanic ash</div>
        </div>
        <div class="hotspot" style="top: 70%; left: 55%;">
            <span class="hotspot-dot"></span>
            <div class="hotspot-caption">Firebreak trench</div>
        </div>
        <div class="hotspot" style="top: 65%; left: 30%;">
            <span class="hotspot-dot"></span>
            <div class="hotspot-caption">The embers advance slowly underground. <br>There is rarely smoke on the surface.</div>
        </div>
    </div>
</body>
</html>
