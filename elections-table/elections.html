<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elections Statistics</title>
    <link rel="stylesheet" href="elections.css">
</head>
<body>
    <label for="district">Choose a district</label>
    <select name="district" id="district">
        <option value="Confederation" selected>Confederation</option>
        <option value="Nose Hill">Nose Hill</option>
        <option value="Centre">Centre</option>
    </select>
    <table id="results-table">
        <caption></caption>
        <thead>
            <tr><th>Name</th><th>Votes</th><th>%</th></tr>
        </thead>
        <tbody></tbody>
    </table>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
    <script src="elections.js" defer></script>
</body>
</html>
